<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Personal hygiene interruption cycle</title>
  <desc id="desc">A cycle begins with the directed hygiene routine, continues through careful work, and if hygiene is interrupted leads to stopping, restoring hygiene and returning to work.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#cf5b43"/></marker></defs>
  <rect width="1200" height="720" rx="28" fill="#fffdf8"/>
  <text x="70" y="72" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#173f35">Restore hygiene before returning to food work</text>
  <g fill="none" stroke="#cf5b43" stroke-width="7" marker-end="url(#arrow)">
    <path d="M360 230C510 95 700 95 840 225"/><path d="M918 300C1010 385 950 510 820 552"/><path d="M730 600C550 675 345 610 286 470"/><path d="M270 375C228 300 262 250 330 226"/>
  </g>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="120" y="180" width="300" height="132" rx="22" fill="#dcebe3" stroke="#173f35" stroke-width="3"/><text x="270" y="235" font-size="25" font-weight="700" fill="#20312b">1 · Directed hygiene</text><text x="270" y="272" font-size="25" font-weight="700" fill="#20312b">routine</text>
    <rect x="780" y="180" width="300" height="132" rx="22" fill="#dcebe3" stroke="#173f35" stroke-width="3"/><text x="930" y="235" font-size="25" font-weight="700" fill="#20312b">2 · Work carefully</text><text x="930" y="272" font-size="21" fill="#617069">Stay aware</text>
    <rect x="780" y="470" width="300" height="132" rx="22" fill="#fff0c8" stroke="#b78418" stroke-width="3"/><text x="930" y="522" font-size="24" font-weight="700" fill="#20312b">3 · Notice an</text><text x="930" y="557" font-size="24" font-weight="700" fill="#20312b">interruption</text>
    <rect x="120" y="470" width="300" height="132" rx="22" fill="#f7ddd7" stroke="#cf5b43" stroke-width="3"/><text x="270" y="522" font-size="24" font-weight="700" fill="#20312b">4 · Stop and restore</text><text x="270" y="557" font-size="24" font-weight="700" fill="#20312b">directed hygiene</text>
    <circle cx="600" cy="370" r="126" fill="#173f35"/><text x="600" y="350" font-size="31" font-weight="800" fill="white">Hygiene</text><text x="600" y="390" font-size="25" fill="#dcebe3">pause · restore</text><text x="600" y="424" font-size="25" fill="#dcebe3">return</text>
  </g>
  <text x="600" y="683" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="24" font-weight="650" fill="#617069">After hygiene is restored, return to careful food work.</text>
</svg>
