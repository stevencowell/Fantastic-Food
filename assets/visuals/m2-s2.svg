<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4002" viewBox="0 0 600 2001" role="img" aria-labelledby="title desc">
<title id="title">Accurate Measuring and Managing a Practical</title>
<desc id="desc">Diagram for Accurate Measuring and Managing a Practical: a simple measuring decision pathway: read the current quantity and unit, select a suitable provided measuring tool, measure carefully, pause to check, then combine only when the information has been confirmed. A measurement flow showing students read the current quantity and unit, select a suitable provided measuring tool, measure carefully, pause to check and combine only when the information is confirmed.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202632}.title{font-size:30px;font-weight:800}.eyebrow{font-size:27px;font-weight:800;letter-spacing:1.1px;fill:#9b4e14}.node{font-size:27px;font-weight:760}.node-small{font-size:27px;font-weight:760}.num{font-size:27px;font-weight:850;fill:white}.form-label{font-size:27px;font-weight:800;fill:#596273}.relation-title,.legend-title{font-size:27px;font-weight:850;fill:#303c78}.relation{font-size:27px;font-weight:700}.relation-steps{font-weight:900;fill:#303c78}.group{font-size:27px;fill:#515966}.group-label{font-weight:850;fill:#303c78}.legend{font-size:27px;fill:#515966}.legend-key{font-weight:900;fill:#202632;text-transform:capitalize}.footer{font-size:27px;fill:#66707c}</style>
<style id="mobile-type-floor">.eyebrow,.node-small,.num,.form-label,.relation,.group,.legend,.footer{font-size:27px}.branch-key{font-size:27px;font-weight:900;fill:#303c78}.branch-text{font-size:27px;font-weight:700;fill:#384354}</style>
<rect width="600" height="2001" rx="28" fill="#fffdf8"/>
<rect x="18" y="18" width="564" height="1965" rx="22" fill="none" stroke="#f0d8bd" stroke-width="2"/>
<text x="30" y="54" class="eyebrow">FANTASTIC FOOD • FLOW MAP</text>
<text x="30" y="96" class="title"><tspan x="30" dy="0">Accurate Measuring and Managing a</tspan><tspan x="30" dy="34">Practical</tspan></text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#525d6c"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#232938" flood-opacity=".12"/></filter></defs>

<g aria-label="Directional arrows"><path d="M 300.0 285.0 L 300.0 348.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 490.0 L 300.0 553.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 695.0 L 300.0 758.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 900.0 L 300.0 963.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/></g>
<g aria-label="Concepts"><g aria-label="Read quantity and unit"><rect x="50" y="165" width="500" height="112" rx="55" fill="#e1effa" stroke="#245f87" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="189" r="17" fill="#245f87"/><text x="74" y="197" text-anchor="middle" class="num">1</text><text x="300" y="230" text-anchor="middle" class="node"><tspan x="300" dy="0">Read quantity and unit</tspan></text></g><g aria-label="Select suitable provided tool"><rect x="50" y="370" width="500" height="112" rx="55" fill="#e1effa" stroke="#245f87" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="394" r="17" fill="#245f87"/><text x="74" y="402" text-anchor="middle" class="num">2</text><text x="300" y="435" text-anchor="middle" class="node"><tspan x="300" dy="0">Select suitable provided tool</tspan></text></g><g aria-label="Measure carefully"><rect x="50" y="575" width="500" height="112" rx="55" fill="#e1effa" stroke="#245f87" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="599" r="17" fill="#245f87"/><text x="74" y="607" text-anchor="middle" class="num">3</text><text x="300" y="640" text-anchor="middle" class="node"><tspan x="300" dy="0">Measure carefully</tspan></text></g><g aria-label="Pause to check"><rect x="50" y="780" width="500" height="112" rx="55" fill="#fff0bf" stroke="#8b5b00" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="804" r="17" fill="#8b5b00"/><text x="74" y="812" text-anchor="middle" class="num">4</text><text x="300" y="845" text-anchor="middle" class="node"><tspan x="300" dy="0">Pause to check</tspan></text></g><g aria-label="Combine when confirmed"><rect x="50" y="985" width="500" height="112" rx="55" fill="#e1effa" stroke="#245f87" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="1009" r="17" fill="#245f87"/><text x="74" y="1017" text-anchor="middle" class="num">5</text><text x="300" y="1050" text-anchor="middle" class="node"><tspan x="300" dy="0">Combine when confirmed</tspan></text></g></g>
<text x="34" y="1149" class="relation-title">Arrow meanings</text>
<g aria-label="Visible relationship labels"><g><rect x="34" y="1169" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1197" class="relation"><tspan class="relation-steps">1 → 2</tspan><tspan dx="14">use current information</tspan></text></g><g><rect x="34" y="1217" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1245" class="relation"><tspan class="relation-steps">2 → 3</tspan><tspan dx="14">measure with tool</tspan></text></g><g><rect x="34" y="1265" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1293" class="relation"><tspan class="relation-steps">3 → 4</tspan><tspan dx="14">check before continuing</tspan></text></g><g><rect x="34" y="1313" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1341" class="relation"><tspan class="relation-steps">4 → 5</tspan><tspan dx="14">only when confirmed</tspan></text></g></g>
<text x="34" y="1397" class="relation-title">Structure</text>
<g aria-label="Visual groupings"><text x="36" y="1443" class="group"><tspan class="group-label">Measure and verify:</tspan> 1, 2, 3, 4</text><text x="36" y="1485" class="group"><tspan class="group-label">Confirmed action:</tspan> 5</text></g>
<text x="34" y="1547" class="legend-title">Colour key</text>
<g aria-label="Colour meanings"><g><rect x="36" y="1574" width="42" height="42" rx="10" fill="#e1effa" stroke="#245f87" stroke-width="3"/><text x="94" y="1597" class="legend"><tspan class="legend-key">blue</tspan><tspan x="94" dy="27">current measurement information</tspan><tspan x="94" dy="27">and action</tspan></text></g><g><rect x="36" y="1678" width="42" height="42" rx="10" fill="#fff0bf" stroke="#8b5b00" stroke-width="3"/><text x="94" y="1701" class="legend"><tspan class="legend-key">amber</tspan><tspan x="94" dy="27">pause for checking</tspan></text></g><g><rect x="36" y="1782" width="42" height="42" rx="10" fill="#dff4e8" stroke="#236443" stroke-width="3"/><text x="94" y="1805" class="legend"><tspan class="legend-key">green</tspan><tspan x="94" dy="27">information confirmed before</tspan><tspan x="94" dy="27">combining</tspan></text></g></g>

</svg>
