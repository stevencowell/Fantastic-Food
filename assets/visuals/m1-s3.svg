<title id="title">Kitchen Hygiene, Hazards and Washing Up</title>
<desc id="desc">Diagram for Kitchen Hygiene, Hazards and Washing Up: a simple comparison between noticing a possible hazard and noticing an unhygienic behaviour, with both pathways leading to stopping, reporting or asking when unsure, then following teacher directions. A comparison showing two starting points: noticing a possible hazard or noticing unhygienic behaviour. Both lead to stopping, reporting or asking when unsure, then following teacher directions.</desc>
