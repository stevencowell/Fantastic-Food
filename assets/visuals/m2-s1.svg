<title id="title">Reading Recipes: Scones and Savoury Twists</title>
<desc id="desc">Diagram for Reading Recipes: Scones and Savoury Twists: a simple recipe-reading pathway: identify the title, find ingredients and quantities, locate equipment information when supplied, read the full method, notice the sequence, then check the current recipe while working. A left-to-right recipe-reading flow: identify the title, find ingredients and quantities, locate equipment information when supplied, read the full method, notice the sequence and keep checking the current recipe while working.</desc>
