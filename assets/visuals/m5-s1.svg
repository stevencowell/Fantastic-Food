<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4330" viewBox="0 0 600 2165" role="img" aria-labelledby="title desc">
<title id="title">Fibre and Water for Healthy Bodies</title>
<desc id="desc">Diagram for Fibre and Water for Healthy Bodies: two connected but different roles within an overall eating pattern: fibre from a range of plant-food groups supporting normal digestive function, and water supporting hydration and normal body functions, with both linked to variety rather than a single product. A comparison showing different but connected roles. Fibre from a range of plant-food groups supports normal digestive function. Water supports hydration and normal body functions. Both connect to variety rather than a single product.</desc>
