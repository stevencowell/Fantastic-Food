<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5014" viewBox="0 0 600 2507" role="img" aria-labelledby="title desc">
<title id="title">Food Orders and Practical Organisation</title>
<desc id="desc">Diagram for Food Orders and Practical Organisation: a simple checking pathway from approved recipe or plan to food order: identify required items and quantities, check names and amounts, look for missing or duplicated entries, confirm each entry has a planned use, then connect the completed order to practical workflow. A flow from an approved recipe or plan to identifying required items and quantities, checking names and amounts, finding missing or duplicated entries, confirming each entry has a planned use, completing the order and connecting it to practical workflow.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202632}.title{font-size:30px;font-weight:800}.eyebrow{font-size:27px;font-weight:800;letter-spacing:1.1px;fill:#9b4e14}.node{font-size:27px;font-weight:760}.node-small{font-size:27px;font-weight:760}.num{font-size:27px;font-weight:850;fill:white}.form-label{font-size:27px;font-weight:800;fill:#596273}.relation-title,.legend-title{font-size:27px;font-weight:850;fill:#303c78}.relation{font-size:27px;font-weight:700}.relation-steps{font-weight:900;fill:#303c78}.group{font-size:27px;fill:#515966}.group-label{font-weight:850;fill:#303c78}.legend{font-size:27px;fill:#515966}.legend-key{font-weight:900;fill:#202632;text-transform:capitalize}.footer{font-size:27px;fill:#66707c}</style>
<style id="mobile-type-floor">.eyebrow,.node-small,.num,.form-label,.relation,.group,.legend,.footer{font-size:27px}.branch-key{font-size:27px;font-weight:900;fill:#303c78}.branch-text{font-size:27px;font-weight:700;fill:#384354}</style>
<rect width="600" height="2507" rx="28" fill="#fffdf8"/>
<rect x="18" y="18" width="564" height="2471" rx="22" fill="none" stroke="#f0d8bd" stroke-width="2"/>
<text x="30" y="54" class="eyebrow">FANTASTIC FOOD • FLOW MAP</text>
<text x="30" y="96" class="title"><tspan x="30" dy="0">Food Orders and Practical</tspan><tspan x="30" dy="34">Organisation</tspan></text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#525d6c"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#232938" flood-opacity=".12"/></filter></defs>

<g aria-label="Directional arrows"><path d="M 300.0 285.0 L 300.0 348.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 490.0 L 300.0 553.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 695.0 L 300.0 758.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 900.0 L 300.0 963.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 1105.0 L 300.0 1168.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 1310.0 L 300.0 1373.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/></g>
<g aria-label="Concepts"><g aria-label="Approved recipe or plan"><rect x="50" y="165" width="500" height="112" rx="55" fill="#e1effa" stroke="#245f87" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="189" r="17" fill="#245f87"/><text x="74" y="197" text-anchor="middle" class="num">1</text><text x="300" y="230" text-anchor="middle" class="node"><tspan x="300" dy="0">Approved recipe or plan</tspan></text></g><g aria-label="Identify items and quantities"><rect x="50" y="370" width="500" height="112" rx="55" fill="#dff4e8" stroke="#236443" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="394" r="17" fill="#236443"/><text x="74" y="402" text-anchor="middle" class="num">2</text><text x="300" y="435" text-anchor="middle" class="node"><tspan x="300" dy="0">Identify items and quantities</tspan></text></g><g aria-label="Check names and amounts"><rect x="50" y="575" width="500" height="112" rx="55" fill="#dff4e8" stroke="#236443" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="599" r="17" fill="#236443"/><text x="74" y="607" text-anchor="middle" class="num">3</text><text x="300" y="640" text-anchor="middle" class="node"><tspan x="300" dy="0">Check names and amounts</tspan></text></g><g aria-label="Find missing or duplicates"><rect x="50" y="780" width="500" height="112" rx="55" fill="#dff4e8" stroke="#236443" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="804" r="17" fill="#236443"/><text x="74" y="812" text-anchor="middle" class="num">4</text><text x="300" y="845" text-anchor="middle" class="node"><tspan x="300" dy="0">Find missing or duplicates</tspan></text></g><g aria-label="Confirm planned use"><rect x="50" y="985" width="500" height="112" rx="55" fill="#e1effa" stroke="#245f87" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="1009" r="17" fill="#245f87"/><text x="74" y="1017" text-anchor="middle" class="num">5</text><text x="300" y="1050" text-anchor="middle" class="node"><tspan x="300" dy="0">Confirm planned use</tspan></text></g><g aria-label="Completed order"><rect x="50" y="1190" width="500" height="112" rx="55" fill="#dff4e8" stroke="#236443" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="1214" r="17" fill="#236443"/><text x="74" y="1222" text-anchor="middle" class="num">6</text><text x="300" y="1255" text-anchor="middle" class="node"><tspan x="300" dy="0">Completed order</tspan></text></g><g aria-label="Practical workflow"><rect x="50" y="1395" width="500" height="112" rx="55" fill="#dff4e8" stroke="#236443" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="1419" r="17" fill="#236443"/><text x="74" y="1427" text-anchor="middle" class="num">7</text><text x="300" y="1460" text-anchor="middle" class="node"><tspan x="300" dy="0">Practical workflow</tspan></text></g></g>
<text x="34" y="1559" class="relation-title">Arrow meanings</text>
<g aria-label="Visible relationship labels"><g><rect x="34" y="1579" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1607" class="relation"><tspan class="relation-steps">1 → 2</tspan><tspan dx="14">identify requirements</tspan></text></g><g><rect x="34" y="1627" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1655" class="relation"><tspan class="relation-steps">2 → 3</tspan><tspan dx="14">verify entries</tspan></text></g><g><rect x="34" y="1675" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1703" class="relation"><tspan class="relation-steps">3 → 4</tspan><tspan dx="14">look for errors</tspan></text></g><g><rect x="34" y="1723" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1751" class="relation"><tspan class="relation-steps">4 → 5</tspan><tspan dx="14">then confirm purpose</tspan></text></g><g><rect x="34" y="1771" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1799" class="relation"><tspan class="relation-steps">5 → 6</tspan><tspan dx="14">complete order</tspan></text></g><g><rect x="34" y="1819" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1847" class="relation"><tspan class="relation-steps">6 → 7</tspan><tspan dx="14">supports workflow</tspan></text></g></g>
<text x="34" y="1903" class="relation-title">Structure</text>
<g aria-label="Visual groupings"><text x="36" y="1949" class="group"><tspan class="group-label">Order checks:</tspan> 3, 4, 5</text><text x="36" y="1991" class="group"><tspan class="group-label">Practical organisation:</tspan> 6, 7</text></g>
