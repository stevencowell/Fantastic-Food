<g aria-label="Colour meanings"><g><rect x="36" y="2080" width="42" height="42" rx="10" fill="#e1effa" stroke="#245f87" stroke-width="3"/><text x="94" y="2103" class="legend"><tspan class="legend-key">blue</tspan><tspan x="94" dy="27">information from the approved</tspan><tspan x="94" dy="27">recipe or plan</tspan></text></g><g><rect x="36" y="2184" width="42" height="42" rx="10" fill="#fff0bf" stroke="#8b5b00" stroke-width="3"/><text x="94" y="2207" class="legend"><tspan class="legend-key">amber</tspan><tspan x="94" dy="27">checking entries for problems</tspan></text></g><g><rect x="36" y="2288" width="42" height="42" rx="10" fill="#dff4e8" stroke="#236443" stroke-width="3"/><text x="94" y="2311" class="legend"><tspan class="legend-key">green</tspan><tspan x="94" dy="27">confirmed order and workflow</tspan><tspan x="94" dy="27">connection</tspan></text></g></g>

