<title id="title">Workflow Planning in the Kitchen</title>
<desc id="desc">Diagram for Workflow Planning in the Kitchen: a simple workflow map linking the finished result to preparation, dependent tasks, logical sequencing, purposeful use of waiting time, progress checks and final clean-up. A central finished result linked to preparation, dependent tasks, logical sequencing, purposeful use of waiting time, progress checks and final clean-up.</desc>
