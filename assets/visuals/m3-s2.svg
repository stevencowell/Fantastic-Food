<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="5702" viewBox="0 0 600 2851" role="img" aria-labelledby="title desc">
<title id="title">The Australian Guide to Healthy Eating and Adolescent Needs</title>
<desc id="desc">Diagram for The Australian Guide to Healthy Eating and Adolescent Needs: the five Australian Guide to Healthy Eating food groups as parts of an overall eating pattern, with water identified as the preferred drink, and connect variety across groups with broad adolescent needs such as energy, growth and body processes. A hub showing five food groups as parts of an overall eating pattern, with water identified as the preferred drink. Variety across the groups links to the broad adolescent needs of energy, growth and body processes.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202632}.title{font-size:30px;font-weight:800}.eyebrow{font-size:27px;font-weight:800;letter-spacing:1.1px;fill:#9b4e14}.node{font-size:27px;font-weight:760}.node-small{font-size:27px;font-weight:760}.num{font-size:27px;font-weight:850;fill:white}.form-label{font-size:27px;font-weight:800;fill:#596273}.relation-title,.legend-title{font-size:27px;font-weight:850;fill:#303c78}.relation{font-size:27px;font-weight:700}.relation-steps{font-weight:900;fill:#303c78}.group{font-size:27px;fill:#515966}.group-label{font-weight:850;fill:#303c78}.legend{font-size:27px;fill:#515966}.legend-key{font-weight:900;fill:#202632;text-transform:capitalize}.footer{font-size:27px;fill:#66707c}</style>
