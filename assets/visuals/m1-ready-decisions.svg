<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Ready to work safely decision pathway</title>
  <desc id="desc">Four connected steps: follow teacher directions, notice a possible hazard, stop when unsure, and ask for guidance.</desc>
  <defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#cf5b43"/></marker></defs>
  <rect width="1200" height="620" rx="28" fill="#fffdf8"/>
  <text x="70" y="76" font-family="Segoe UI, sans-serif" font-size="38" font-weight="700" fill="#173f35">When you are unsure, pause and ask</text>
  <text x="70" y="116" font-family="Segoe UI, sans-serif" font-size="24" fill="#617069">Read from left to right.</text>
  <g font-family="Segoe UI, sans-serif" text-anchor="middle">
    <rect x="60" y="210" width="235" height="170" rx="22" fill="#dcebe3" stroke="#173f35" stroke-width="3"/>
    <circle cx="178" cy="252" r="25" fill="#173f35"/><text x="178" y="261" font-size="24" font-weight="800" fill="white">1</text>
    <text x="178" y="320" font-size="25" font-weight="700" fill="#20312b">Follow teacher</text><text x="178" y="352" font-size="25" font-weight="700" fill="#20312b">directions</text>
    <rect x="345" y="210" width="235" height="170" rx="22" fill="#fff0c8" stroke="#b78418" stroke-width="3"/>
    <circle cx="463" cy="252" r="25" fill="#b78418"/><text x="463" y="261" font-size="24" font-weight="800" fill="white">2</text>
    <text x="463" y="320" font-size="25" font-weight="700" fill="#20312b">Notice a possible</text><text x="463" y="352" font-size="25" font-weight="700" fill="#20312b">hazard</text>
    <rect x="630" y="210" width="235" height="170" rx="22" fill="#f7ddd7" stroke="#cf5b43" stroke-width="3"/>
    <circle cx="748" cy="252" r="25" fill="#cf5b43"/><text x="748" y="261" font-size="24" font-weight="800" fill="white">3</text>
    <text x="748" y="320" font-size="25" font-weight="700" fill="#20312b">Stop when</text><text x="748" y="352" font-size="25" font-weight="700" fill="#20312b">unsure</text>
    <rect x="915" y="210" width="235" height="170" rx="22" fill="#dcebe3" stroke="#173f35" stroke-width="3"/>
    <circle cx="1033" cy="252" r="25" fill="#173f35"/><text x="1033" y="261" font-size="24" font-weight="800" fill="white">4</text>
    <text x="1033" y="320" font-size="25" font-weight="700" fill="#20312b">Ask for</text><text x="1033" y="352" font-size="25" font-weight="700" fill="#20312b">guidance</text>
  </g>
  <g stroke="#cf5b43" stroke-width="7" fill="none" marker-end="url(#arrow)"><path d="M300 295H330"/><path d="M585 295H615"/><path d="M870 295H900"/></g>
  <g font-family="Segoe UI, sans-serif" font-size="20" font-weight="650" fill="#7c3c2e" text-anchor="middle"><text x="315" y="275">while working</text><text x="600" y="275">if unsure</text><text x="885" y="275">seek help</text></g>
  <rect x="230" y="460" width="740" height="82" rx="18" fill="#173f35"/><text x="600" y="512" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="27" font-weight="700" fill="white">Safe food work is teacher-directed work.</text>
</svg>
