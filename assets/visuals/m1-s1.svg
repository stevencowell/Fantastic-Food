<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="3412" viewBox="0 0 600 1706" role="img" aria-labelledby="title desc">
<title id="title">Ready to Work Safely in Food Technology</title>
<desc id="desc">Diagram for Ready to Work Safely in Food Technology: a simple decision pathway linking teacher directions, noticing a possible hazard, stopping when unsure and asking for guidance. A left-to-right flow showing that students follow teacher directions, notice a possible hazard, stop when unsure and ask for guidance.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202632}.title{font-size:30px;font-weight:800}.eyebrow{font-size:27px;font-weight:800;letter-spacing:1.1px;fill:#9b4e14}.node{font-size:27px;font-weight:760}.node-small{font-size:27px;font-weight:760}.num{font-size:27px;font-weight:850;fill:white}.form-label{font-size:27px;font-weight:800;fill:#596273}.relation-title,.legend-title{font-size:27px;font-weight:850;fill:#303c78}.relation{font-size:27px;font-weight:700}.relation-steps{font-weight:900;fill:#303c78}.group{font-size:27px;fill:#515966}.group-label{font-weight:850;fill:#303c78}.legend{font-size:27px;fill:#515966}.legend-key{font-weight:900;fill:#202632;text-transform:capitalize}.footer{font-size:27px;fill:#66707c}</style>
<style id="mobile-type-floor">.eyebrow,.node-small,.num,.form-label,.relation,.group,.legend,.footer{font-size:27px}.branch-key{font-size:27px;font-weight:900;fill:#303c78}.branch-text{font-size:27px;font-weight:700;fill:#384354}</style>
<rect width="600" height="1706" rx="28" fill="#fffdf8"/>
<rect x="18" y="18" width="564" height="1670" rx="22" fill="none" stroke="#f0d8bd" stroke-width="2"/>
<text x="30" y="54" class="eyebrow">FANTASTIC FOOD • FLOW MAP</text>
<text x="30" y="96" class="title"><tspan x="30" dy="0">Ready to Work Safely in Food</tspan><tspan x="30" dy="34">Technology</tspan></text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#525d6c"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#232938" flood-opacity=".12"/></filter></defs>

<g aria-label="Directional arrows"><path d="M 300.0 285.0 L 300.0 348.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 490.0 L 300.0 553.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 695.0 L 300.0 758.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/></g>
<g aria-label="Concepts"><g aria-label="Follow teacher directions"><rect x="50" y="165" width="500" height="112" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="189" r="17" fill="#303c78"/><text x="74" y="197" text-anchor="middle" class="num">1</text><text x="300" y="230" text-anchor="middle" class="node"><tspan x="300" dy="0">Follow teacher directions</tspan></text></g><g aria-label="Notice possible hazard"><rect x="50" y="370" width="500" height="112" rx="55" fill="#fff0bf" stroke="#8b5b00" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="394" r="17" fill="#8b5b00"/><text x="74" y="402" text-anchor="middle" class="num">2</text><text x="300" y="435" text-anchor="middle" class="node"><tspan x="300" dy="0">Notice possible hazard</tspan></text></g><g aria-label="Stop when unsure"><rect x="50" y="575" width="500" height="112" rx="55" fill="#fff0bf" stroke="#8b5b00" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="599" r="17" fill="#8b5b00"/><text x="74" y="607" text-anchor="middle" class="num">3</text><text x="300" y="640" text-anchor="middle" class="node"><tspan x="300" dy="0">Stop when unsure</tspan></text></g><g aria-label="Ask for guidance"><rect x="50" y="780" width="500" height="112" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="74" cy="804" r="17" fill="#303c78"/><text x="74" y="812" text-anchor="middle" class="num">4</text><text x="300" y="845" text-anchor="middle" class="node"><tspan x="300" dy="0">Ask for guidance</tspan></text></g></g>
<text x="34" y="944" class="relation-title">Arrow meanings</text>
<g aria-label="Visible relationship labels"><g><rect x="34" y="964" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="992" class="relation"><tspan class="relation-steps">1 → 2</tspan><tspan dx="14">while working</tspan></text></g><g><rect x="34" y="1012" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1040" class="relation"><tspan class="relation-steps">2 → 3</tspan><tspan dx="14">if unsure</tspan></text></g><g><rect x="34" y="1060" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1088" class="relation"><tspan class="relation-steps">3 → 4</tspan><tspan dx="14">seek guidance</tspan></text></g></g>
<text x="34" y="1144" class="relation-title">Structure</text>
<g aria-label="Visual groupings"><text x="36" y="1190" class="group"><tspan class="group-label">Safe work response:</tspan> 2, 3, 4</text></g>
