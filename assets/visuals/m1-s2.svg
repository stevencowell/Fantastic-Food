<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="4636" viewBox="0 0 600 2318" role="img" aria-labelledby="title desc">
<title id="title">Personal Hygiene for Safe Food Work</title>
<desc id="desc">Diagram for Personal Hygiene for Safe Food Work: a simple hygiene decision pathway: begin with the directed hygiene routine, work carefully, notice when hygiene may have been interrupted, stop, restore hygiene according to teacher directions, then return to food work. A cycle beginning with the directed hygiene routine, followed by careful food work. If hygiene may have been interrupted, students stop, restore hygiene according to teacher directions and return to food work.</desc>
<style>text{font-family:Inter,Arial,sans-serif;fill:#202632}.title{font-size:30px;font-weight:800}.eyebrow{font-size:27px;font-weight:800;letter-spacing:1.1px;fill:#9b4e14}.node{font-size:27px;font-weight:760}.node-small{font-size:27px;font-weight:760}.num{font-size:27px;font-weight:850;fill:white}.form-label{font-size:27px;font-weight:800;fill:#596273}.relation-title,.legend-title{font-size:27px;font-weight:850;fill:#303c78}.relation{font-size:27px;font-weight:700}.relation-steps{font-weight:900;fill:#303c78}.group{font-size:27px;fill:#515966}.group-label{font-weight:850;fill:#303c78}.legend{font-size:27px;fill:#515966}.legend-key{font-weight:900;fill:#202632;text-transform:capitalize}.footer{font-size:27px;fill:#66707c}</style>
<style id="mobile-type-floor">.eyebrow,.node-small,.num,.form-label,.relation,.group,.legend,.footer{font-size:27px}.branch-key{font-size:27px;font-weight:900;fill:#303c78}.branch-text{font-size:27px;font-weight:700;fill:#384354}</style>
<rect width="600" height="2318" rx="28" fill="#fffdf8"/>
<rect x="18" y="18" width="564" height="2282" rx="22" fill="none" stroke="#f0d8bd" stroke-width="2"/>
<text x="30" y="54" class="eyebrow">FANTASTIC FOOD • CYCLE MAP</text>
<text x="30" y="96" class="title"><tspan x="30" dy="0">Personal Hygiene for Safe Food</tspan><tspan x="30" dy="34">Work</tspan></text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#525d6c"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#232938" flood-opacity=".12"/></filter></defs>
<rect x="20" y="150" width="560" height="1095" rx="90" fill="#fffaf2" stroke="#d9b98c" stroke-width="4" stroke-dasharray="12 10"/><text x="300" y="1270" text-anchor="middle" class="form-label" data-simple-cycle-spacing="2"><tspan x="300">Cycle — follow the arrows in the body.</tspan><tspan x="300" dy="34">Use the side return arrow and key.</tspan></text>
<g aria-label="Directional arrows"><path d="M 300.0 308.0 L 300.0 338.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 493.0 L 300.0 523.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 678.0 L 300.0 708.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 863.0 L 300.0 893.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path d="M 300.0 1048.0 L 300.0 1078.0" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><path aria-label="Return path: resume carefully" d="M 543 1162.5 L 548 1162.5 L 548 422.5 L 543 422.5" fill="none" stroke="#525d6c" stroke-width="4" marker-end="url(#arrow)"/><text x="570" y="792" text-anchor="middle" transform="rotate(-90 570 792)" style="font-size:27px;font-weight:850;fill:#384354;paint-order:stroke;stroke:#fffaf2;stroke-width:7px;stroke-linejoin:round">resume carefully</text></g>
<g aria-label="Concepts"><g aria-label="Directed hygiene routine"><rect x="65" y="175" width="470" height="125" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="89" cy="199" r="17" fill="#303c78"/><text x="89" y="207" text-anchor="middle" class="num">1</text><text x="300" y="246.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Directed hygiene routine</tspan></text></g><g aria-label="Work carefully"><rect x="65" y="360" width="470" height="125" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="89" cy="384" r="17" fill="#303c78"/><text x="89" y="392" text-anchor="middle" class="num">2</text><text x="300" y="431.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Work carefully</tspan></text></g><g aria-label="Notice hygiene interruption"><rect x="65" y="545" width="470" height="125" rx="55" fill="#fff0bf" stroke="#8b5b00" stroke-width="4" filter="url(#shadow)"/><circle cx="89" cy="569" r="17" fill="#8b5b00"/><text x="89" y="577" text-anchor="middle" class="num">3</text><text x="300" y="602" text-anchor="middle" class="node"><tspan x="300" dy="0">Notice hygiene</tspan><tspan x="300" dy="29">interruption</tspan></text></g><g aria-label="Stop food work"><rect x="65" y="730" width="470" height="125" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="89" cy="754" r="17" fill="#303c78"/><text x="89" y="762" text-anchor="middle" class="num">4</text><text x="300" y="801.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Stop food work</tspan></text></g><g aria-label="Restore directed hygiene"><rect x="65" y="915" width="470" height="125" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="89" cy="939" r="17" fill="#303c78"/><text x="89" y="947" text-anchor="middle" class="num">5</text><text x="300" y="986.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Restore directed hygiene</tspan></text></g><g aria-label="Return to food work"><rect x="65" y="1100" width="470" height="125" rx="55" fill="#e7e9f7" stroke="#303c78" stroke-width="4" filter="url(#shadow)"/><circle cx="89" cy="1124" r="17" fill="#303c78"/><text x="89" y="1132" text-anchor="middle" class="num">6</text><text x="300" y="1171.5" text-anchor="middle" class="node"><tspan x="300" dy="0">Return to food work</tspan></text></g></g>
<text x="34" y="1412" class="relation-title">Arrow meanings</text>
<g aria-label="Visible relationship labels"><g><rect x="34" y="1432" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1460" class="relation"><tspan class="relation-steps">1 → 2</tspan><tspan dx="14">begin work</tspan></text></g><g><rect x="34" y="1480" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1508" class="relation"><tspan class="relation-steps">2 → 3</tspan><tspan dx="14">stay aware</tspan></text></g><g><rect x="34" y="1528" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1556" class="relation"><tspan class="relation-steps">3 → 4</tspan><tspan dx="14">pause work</tspan></text></g><g><rect x="34" y="1576" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1604" class="relation"><tspan class="relation-steps">4 → 5</tspan><tspan dx="14">follow directions</tspan></text></g><g><rect x="34" y="1624" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1652" class="relation"><tspan class="relation-steps">5 → 6</tspan><tspan dx="14">hygiene restored</tspan></text></g><g><rect x="34" y="1672" width="532" height="40" rx="12" fill="#ffffff" stroke="#e4d5c4"/><text x="52" y="1700" class="relation"><tspan class="relation-steps">6 → 2</tspan><tspan dx="14">resume carefully</tspan></text></g></g>
<text x="34" y="1756" class="relation-title">Structure</text>
<g aria-label="Visual groupings"><text x="36" y="1802" class="group"><tspan class="group-label">Hygiene recovery:</tspan> 3, 4, 5, 6</text></g>
<text x="34" y="1864" class="legend-title">Colour key</text>
<g aria-label="Colour meanings"><g><rect x="36" y="1891" width="42" height="42" rx="10" fill="#e7e9f7" stroke="#303c78" stroke-width="3"/><text x="94" y="1914" class="legend"><tspan class="legend-key">navy</tspan><tspan x="94" dy="27">normal directed food work</tspan></text></g><g><rect x="36" y="1995" width="42" height="42" rx="10" fill="#fff0bf" stroke="#8b5b00" stroke-width="3"/><text x="94" y="2018" class="legend"><tspan class="legend-key">amber</tspan><tspan x="94" dy="27">possible hygiene interruption</tspan></text></g><g><rect x="36" y="2099" width="42" height="42" rx="10" fill="#dff4e8" stroke="#236443" stroke-width="3"/><text x="94" y="2122" class="legend"><tspan class="legend-key">green</tspan><tspan x="94" dy="27">restoring and resuming hygiene</tspan></text></g></g>

</svg>
