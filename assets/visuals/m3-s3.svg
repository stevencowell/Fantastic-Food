<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="6424" viewBox="0 0 600 3212" role="img" aria-labelledby="title desc">
<title id="title">Recipe Modification: Bread Cases and Garlic Cheese Flatbread</title>
<desc id="desc">Diagram for Recipe Modification: Bread Cases and Garlic Cheese Flatbread: a simple recipe-modification design cycle: identify a goal, propose one teacher-permitted change, predict possible effects on sensory qualities, preparation and food role, produce the idea, then evaluate the result against the original goal. A modification cycle beginning with a goal and one teacher-permitted change. Possible effects are considered for sensory qualities, preparation and food role before producing the idea and evaluating it against the original goal.</desc>
