<title id="title">Planning a Balanced Lunchbox</title>
<desc id="desc">Diagram for Planning a Balanced Lunchbox: lunchbox planning as a design process linking the intended user and school day with variety across the five food groups, consideration of water, practicality and a final whole-lunchbox review. A planning hub connecting the intended user and school day with variety across five food groups, consideration of water and practicality, followed by a final review of the whole lunchbox.</desc>
